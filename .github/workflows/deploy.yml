name: Deploy gateway to Fly
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "fly.toml", "Dockerfile", ".github/workflows/deploy.yml", ".github/workflows/image.yml"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Remote builder (flyctl deploy --remote-only) fails to push to
      # registry.fly.io from the builder machine; instead copy the GHCR image
      # built by image.yml into the Fly registry from this runner, then deploy it.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker pull ghcr.io/bshelby88/raen-mcp-gateway:latest
      - run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Push image to Fly registry
        run: |
          docker tag ghcr.io/bshelby88/raen-mcp-gateway:latest registry.fly.io/raen-mcp-gateway:deploy-${GITHUB_SHA::7}
          docker push registry.fly.io/raen-mcp-gateway:deploy-${GITHUB_SHA::7}
      - name: Deploy image
        run: flyctl deploy --image registry.fly.io/raen-mcp-gateway:deploy-${GITHUB_SHA::7} --now -a raen-mcp-gateway
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
